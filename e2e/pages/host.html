<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Portal anfitrión (prueba)</title>
  <style>
    /* CSS hostil a propósito: si el Shadow DOM funciona, nada de esto toca al widget */
    * { all: unset; display: revert; box-sizing: border-box; }
    button { background: red !important; color: lime !important; font-size: 40px !important; border: 5px dashed blue !important; }
    input { background: black !important; color: black !important; }
    body { font-family: 'Comic Sans MS', cursive; background: #ffe; padding: 20px; }
    section { position: fixed !important; }
  </style>
</head>
<body>
  <h1>Portal del tenant</h1>
  <p>Contenido del portal. El widget no debería verse afectado por el CSS de esta página.</p>
  <button id="host-btn">Botón del portal (rojo y feo)</button>
  <script src="/widget.js"></script>
  <script>
    const params = new URLSearchParams(location.search)
    window.__tokenCalls = 0
    window.__el = KorusChat.mount(null, {
      baseUrl: 'http://localhost:8084',
      siteKey: params.get('siteKey'),
      mode: params.get('mode') || 'bubble',
      openOnLoad: params.get('open') === '1',
      getToken: () => { window.__tokenCalls++; return params.get('token') || null }
    })
    window.__events = []
    for (const ev of ['ready', 'ended', 'error', 'preview-expired']) {
      window.__el.addEventListener(ev, e => window.__events.push({ type: ev, detail: e.detail?.[0] ?? e.detail }))
    }
  </script>
</body>
</html>
